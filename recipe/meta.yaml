{% set name = "py-key-value-aio" %}
{% set version = "0.4.4" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  - url: https://github.com/strawgate/py-key-value/archive/refs/tags/{{ version }}.tar.gz
    sha256: 1b3588c7d02e1803ca0bbe43d93773e3d2c1396137f08a884bf241020d2b6630

build:
  number: 1
  skip: true  # [py<310]
  script: {{ PYTHON }} -m pip install . -vv --no-build-isolation --no-deps

requirements:
  host:
    - python
    - uv-build >=0.8.2,<0.9.0
    - pip
  run:
    - python
    - beartype >=0.20.2
    - typing_extensions >=4.15.0
  run_constrained:
    # [project.optional-dependencies.standard]
    # py-key-value-aio[memory]
    - cachetools >=5.0.0
    # py-key-value-aio[disk]
    - diskcache >=5.0.0
    - pathvalidate >=3.3.1
    # filetree
    # while upstream states aiofile>=3.5.0, actual aiofile functionality flush() used by the package was introduced
    # in 3.9.0. pinning min to 3.9.0 instead of a later version based on 'uv.lock' evidence.
    # reference: https://github.com/strawgate/py-key-value/blob/0.4.4/src/key_value/aio/stores/filetree/store.py#L157
    - aiofile >=3.9.0
    - anyio >=4.4.0
    # py-key-value-aio[redis]
    - redis-py >=4.3.0
    # py-key-value-aio[mongodb]
    - pymongo >=4.0.0
    # py-key-value-aio[valkey]
    - valkey-glide >=2.1.0
    # py-key-value-aio[vault]
    - hvac >=2.3.0
    - types-hvac >=2.3.0
    # py-key-value-aio[memcached]
    - aiomcache >=0.8.0
    # py-key-value-aio[elasticsearch]
    - elasticsearch >=8.0.0
    - aiohttp>=3.12
    # py-key-value-aio[dynamodb]
    - aioboto3 >=13.3.0
    - types-aiobotocore-dynamodb >=2.16.0
    # py-key-value-aio[s3]
    - types-aiobotocore-s3 >=2.16.0
    # py-key-value-aio[keyring]
    - keyring >=25.6.0
    # py-key-value-aio[keyring-linux]
    - dbus-python >=1.4.0
    # py-key-value-aio[pydantic]
    - pydantic >=2.11.9
    # py-key-value-aio[rocksdb]
    - rocksdict >=0.3.2  # [py<312]
    - rocksdict >=0.3.24  # [py>=312]
    # py-key-value-aio[wrappers-encryption]
    - cryptography >=45.0.0
    # py-key-value-aio[duckdb]
    - python-duckdb >=1.1.1
    - pytz >=2025.2
    # py-key-value-aio[dynamodb]
    - asyncpg >=0.30.0

{% set skip_tests = "" %}

# tests missing various dependencies
{% set skip_tests = skip_tests + " --ignore=tests/stores/aerospike/test_aerospike.py" %}
{% set skip_tests = skip_tests + " --ignore=tests/stores/dynamodb/test_dynamodb.py" %}
{% set skip_tests = skip_tests + " --ignore=tests/stores/elasticsearch/test_elasticsearch.py" %}
{% set skip_tests = skip_tests + " --ignore=tests/stores/firestore/test_firestore.py" %}
{% set skip_tests = skip_tests + " --ignore=tests/stores/keyring/test_keyring.py" %}
{% set skip_tests = skip_tests + " --ignore=tests/stores/memcached/test_memcached.py" %}
{% set skip_tests = skip_tests + " --ignore=tests/stores/mongodb/test_mongodb.py" %}
{% set skip_tests = skip_tests + " --ignore=tests/stores/opensearch/test_opensearch.py" %}
{% set skip_tests = skip_tests + " --ignore=tests/stores/postgresql/test_postgresql.py" %}
{% set skip_tests = skip_tests + " --ignore=tests/stores/redis/test_redis.py" %}
{% set skip_tests = skip_tests + " --ignore=tests/stores/rocksdb/test_rocksdb.py" %}
{% set skip_tests = skip_tests + " --ignore=tests/stores/s3/test_s3.py" %}
{% set skip_tests = skip_tests + " --ignore=tests/stores/valkey/test_valkey.py" %}
{% set skip_tests = skip_tests + " --ignore=tests/stores/vault/test_vault.py" %}
{% set skip_tests = skip_tests + " --ignore=tests/stores/valkey/test_valkey_cluster.py" %}

{% set raise_fd_limit = "" %}
# increase the fd limit on OSX CI for tests - OSError: [Errno 24] Too many open files
{% set raise_fd_limit = "ulimit -n 4096 && " %}  # [osx]

test:
  source_files:
    - tests
  imports:
    - key_value
    - key_value.shared
    - key_value.aio
    - key_value.aio.stores.base
  requires:
    - pip
    - pytest >=8.4.2,<9 # maxbound: pytest versions 9 and above cause issues with the tests
    - pytest-asyncio >=1.2.0
    - inline-snapshot >=0.30.1
    - dirty-equals >=0.10.0
    # optional dependencies required for test
    - cachetools
    - pydantic
    - python-duckdb
    - aiofile
    - anyio
    - cryptography
    - diskcache
    - pathvalidate
    - elasticsearch
    - redis-py
    - pytz
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - {{ raise_fd_limit }} pytest -vv --asyncio-mode=auto {{ skip_tests }} tests

about:
  license: Apache-2.0
  license_file: LICENSE
  license_family: Apache
  summary: Shared Key-Value, A pluggable interface for KV Stores
  description: |
    This library provides a pluggable interface for key-value
    stores with support for multiple backends, TTL handling,
    type safety, and extensible wrappers.
  home: https://github.com/strawgate/py-key-value
  dev_url: https://github.com/strawgate/py-key-value
  doc_url: https://strawgate.com/py-key-value/

extra:
  recipe-maintainers:
    - viridianmelody
